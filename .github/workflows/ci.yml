name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # eve requires Node >=24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # convex/ is outside the root tsconfig; this is the stricter config Convex deploys with.
      # convex/_generated/ is committed and refreshed whenever a local `npx convex dev` or `deploy`
      # regenerates it; a stale api.d.ts shows up as a diff.
      # Schema vs stored rows is not checked in CI (no production deploy key in GitHub): the reviewer
      # runs `npx convex deploy --dry-run -y` against production on any PR that changes
      # convex/schema.ts. A failure at deploy time fails the Vercel build and leaves the previous
      # deployment serving.
      - name: Typecheck Convex
        run: npx tsc -p convex/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Checks the built bundle, not the source: the funnel threw ENOENT in production for 13 days
      # while typecheck, tests and build all passed.
      - name: Smoke-test the build
        run: pnpm run smoke:build
